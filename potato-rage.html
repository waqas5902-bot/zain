<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angry Potato — Funhouse Arcade</title>
  <link rel="stylesheet" href="arcade.css" />
  <style>
    .stage { text-align: center; margin-top: 6px; }
    .potato-btn {
      position: relative;
      font-size: clamp(90px, 30vw, 150px);
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.06s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .potato-btn:active { transform: scale(0.86); }
    .potato-btn .fire {
      position: absolute;
      top: -34px;
      right: -24px;
      font-size: 56px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .potato-btn.raging .fire { opacity: 1; animation: flicker 0.5s infinite alternate; }
    @keyframes flicker {
      from { transform: scale(1) rotate(-8deg); }
      to   { transform: scale(1.3) rotate(8deg); }
    }
    .meter {
      max-width: 420px;
      margin: 14px auto 0;
      background: #fff;
      border-radius: 999px;
      height: 22px;
      box-shadow: inset 0 2px 6px rgba(60, 40, 60, 0.12);
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fbbf24, #f97316, #ef4444);
      border-radius: 999px;
      transition: width 0.15s ease;
    }
    .rage-label { margin-top: 10px; font-weight: 900; font-size: 18px; }
    .hint-line { text-align: center; color: var(--muted); font-size: 14px; margin-top: 10px; }
    .stage .bubble { max-width: 420px; margin: 14px auto 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="back" href="index.html">← Arcade</a></div>
    <h1>🥔 Angry Potato</h1>
    <p class="sub">The potato is trying to stay calm. <strong>Do not let it.</strong> Click it into MAXIMUM RAGE.</p>

    <div class="stat-bar">
      <div class="stat-box"><span class="label">Rage</span><span class="value" id="rage-num">0</span></div>
      <div class="stat-box"><span class="label">Clicks</span><span class="value" id="clicks">0</span></div>
      <div class="stat-box"><span class="label">Armageddons</span><span class="value" id="arms">0</span></div>
    </div>

    <div class="stage">
      <button class="potato-btn" id="potato" type="button">🥔<span class="fire">🔥</span></button>
      <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
      <div class="rage-label" id="rage-label">Calm Potato</div>
      <div class="bubble" id="bubble">"…"</div>
    </div>

    <p class="hint-line">Rage decays at 1/s. Keep clicking or it calms down.</p>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="emoji">💥</div>
      <h2>POTATO ARMAGEDDON</h2>
      <p id="overlay-text"></p>
      <button class="btn" id="again" type="button">Potato again?</button>
    </div>
  </div>

  <script>
    (function () {
      var potato = document.getElementById("potato");
      var rageNum = document.getElementById("rage-num");
      var clicksEl = document.getElementById("clicks");
      var armsEl = document.getElementById("arms");
      var meterFill = document.getElementById("meter-fill");
      var rageLabel = document.getElementById("rage-label");
      var bubble = document.getElementById("bubble");
      var overlay = document.getElementById("overlay");
      var overlayText = document.getElementById("overlay-text");
      var again = document.getElementById("again");

      var MAX = 100;
      var LINES = [
        "Ugh.", "Hey!", "Stop that.", "I'm trying to chill.", "Seriously?",
        "You're poking the wrong potato.", "I will boil you.", "MASH. MASH. MASH.",
        "FRY YOU.", "I AM BECOME POTATO.", "POTATO SMASH.", "RELEASE THE STARCH.",
        "MY ANCESTORS WERE FRIES."
      ];
      var LEVELS = [
        [0, "Calm Potato"],
        [15, "Mildly Annoyed"],
        [30, "Annoyed Potato"],
        [45, "Angry Potato"],
        [60, "Furious Potato"],
        [75, "RAGING POTATO"],
        [90, "POTATO OF WRATH"],
        [100, "POTATO ARMAGEDDON"]
      ];

      var rage = 0, clicks = 0, arms = 0;
      try { arms = parseInt(localStorage.getItem("funhouse-potato-arms") || "0", 10) || 0; } catch (e) {}
      armsEl.textContent = arms;

      function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function labelFor() {
        var out = LEVELS[0][1];
        for (var i = 0; i < LEVELS.length; i++) {
          if (rage >= LEVELS[i][0]) out = LEVELS[i][1];
        }
        return out;
      }

      function render() {
        rageNum.textContent = Math.floor(rage);
        meterFill.style.width = rage + "%";
        rageLabel.textContent = labelFor();
        potato.classList.toggle("raging", rage >= 75);
      }

      function armageddon() {
        overlayText.textContent = "The potato has achieved " + arms + " armageddon" + (arms === 1 ? "" : "s") + " and counting. It is no longer calm. Ever.";
        overlay.hidden = false;
      }

      potato.addEventListener("pointerdown", function () {
        if (!overlay.hidden) return;
        rage = Math.min(MAX, rage + 3);
        clicks++;
        clicksEl.textContent = clicks;
        if (Math.random() < 0.4) bubble.textContent = '"' + rand(LINES) + '"';
        if (rage >= MAX) {
          rage = 0;
          arms++;
          try { localStorage.setItem("funhouse-potato-arms", String(arms)); } catch (e) {}
          armsEl.textContent = arms;
          armageddon();
        }
        render();
      });

      setInterval(function () {
        if (!overlay.hidden) return;
        if (rage > 0) {
          rage = Math.max(0, rage - 0.1);
          render();
        }
      }, 100);

      again.addEventListener("click", function () {
        rage = 0;
        clicks = 0;
        clicksEl.textContent = "0";
        bubble.textContent = '"…"';
        overlay.hidden = true;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
